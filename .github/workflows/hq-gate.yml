name: HQ Gate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Bootstrap local HQ scaffold
        run: python3 scripts/hq_runtime.py bootstrap

      - name: Reference-project identifier scan
        run: python3 scripts/hq_reference_scan.py scan

      - name: Run HQ gate
        run: python3 scripts/hq_gate.py
